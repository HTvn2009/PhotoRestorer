<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <!-- Section 1: Uploading -->
        <section id="upload-section" class="card">
            <h1>AI Image Analyzer</h1>
            <p>Select an image to see the magic happen.</p>
            
            <div class="drop-zone">
                <label for="image-input" class="custom-file-upload">
                    <span>Choose Image</span>
                </label>
                <input type="file" id="image-input" accept="image/*">
                
                <div id="preview-container" class="hidden">
                    <img id="image-preview" src="" alt="Image Preview">
                </div>
            </div>
        </section>

        <!-- Section 2: Results -->
            <!-- Replace your Results Section in index.html with this -->
    <section id="results-section" class="card">
        <h2>Analysis Results</h2>
        <div id="results-content">
            <!-- Loading Spinner -->
            <div id="loading-spinner" class="hidden">
                <div class="spinner"></div>
                <p>AI is working its magic...</p>
            </div>

            <!-- Interactive Before/After Slider -->
            <div id="comparison-container" class="hidden">
                <!-- The 'After' (AI restored) image sits in the background -->
                <img id="image-after" class="slider-img" src="" alt="Restored Image">
                
                <!-- The 'Before' (Original) image sits on top and gets clipped -->
                <img id="image-before" class="slider-img clipped" src="" alt="Original Image">
                
                <!-- The Slider Handle Line & Control -->
                <div id="slider-handle" class="slider-handle"></div>
                <input type="range" id="comparison-slider" min="0" max="100" value="50">
            </div>

            <p id="placeholder-text" class="placeholder-text">The AI results will appear here once processed...</p>
        </div>
    </section>
    </main>

        <!-- Inside the Upload Section, after the preview-container -->
    <button id="restore-btn" class="primary-btn hidden">✨ Restore Image</button>

    <!-- Inside the Results Section -->
    <div id="results-content">
        <div id="loading-spinner" class="hidden">
            <div class="spinner"></div>
            <p>AI is working its magic...</p>
        </div>
        <img id="result-image" class="hidden" alt="AI Result">
        <p id="placeholder-text">The AI results will appear here...</p>
    </div>
</body>
</html>
