<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PicRes - AI Photo Restoration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
  <aside class="taskbar" aria-label="Main navigation">
    <a class="brand taskbar-brand" href="#restore" aria-label="PicRes home">
      <span class="brand-mark">P</span>
      <span>
        <strong>PicRes</strong>
      </span>
    </a>

    <nav class="task-nav">
      <a class="active" href="#restore" aria-current="page">
        <span class="nav-icon">R</span>
        <span>Restore</span>
      </a>
      <a href="#gallery">
        <span class="nav-icon">G</span>
        <span>My Gallery</span>
      </a>
      <a href="#showcase">
        <span class="nav-icon">S</span>
        <span>Showcase</span>
      </a>
      <a href="#help">
        <span class="nav-icon">?</span>
        <span>Help</span>
      </a>
    </nav>
  </aside>

  <main class="app-shell" id="restore" aria-label="PicRes restoration workspace">
    <header class="topbar">
      <div class="page-title">
        <p class="eyebrow">AI Photo Restoration</p>
        <h1>Restore Image</h1>
      </div>

      <div class="topbar-actions">
        <button id="themeToggle" class="icon-button theme-toggle" type="button" aria-label="Switch to light theme">
          <span>Sun</span>
        </button>
      </div>
    </header>

    <section class="workspace">
      <article class="panel input-panel">
        <div class="panel-head">
          <div>
            <h2>Original picture</h2>
          </div>
        </div>

        <label class="upload-zone" id="uploadZone" for="imageUpload">
          <input type="file" id="imageUpload" accept="image/jpeg,image/png,image/webp" hidden>
          <div class="upload-placeholder">
            <span class="upload-icon">Up</span>
            <strong>Drag and drop</strong>
            <small>Or click to select a JPG, PNG, or WEBP file.</small>
          </div>
          <div class="image-preview" id="imagePreview" hidden>
            <img id="previewImage" alt="Image uploaded">
            <div class="image-meta">
              <strong id="imageFileName"></strong>
              <span id="imageFileDetails"></span>
            </div>
          </div>
        </label>

        <div class="form-grid">
          <label class="field" for="imageName">
            <span>Name</span>
            <input id="imageName" type="text" placeholder="Example: Old Hanoi Street, 1920s">
          </label>

          <label class="field" for="imageInfo">
            <span>Information</span>
            <textarea id="imageInfo" placeholder="Enter what you know: location, year, colors, details to preserve..."></textarea>
          </label>
        </div>

        <button class="button primary" id="runImage" type="button">Restore Image</button>
      </article>

      <article class="panel result-panel">
        <div class="panel-head">
          <div>
            <h2>Result</h2>
          </div>
          <button class="icon-button" id="retryImage" type="button" disabled aria-label="Retry">
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
              <path d="M21 12a9 9 0 1 1-2.64-6.36" />
              <path d="M21 3v6h-6" />
            </svg>
          </button>
        </div>

        <div class="after-zone" id="outputZone">
          <div class="output-placeholder" id="outputPlaceholder">
            <span class="result-mark">AI</span>
            <strong>No result yet</strong>
            <small>Restored images will be displayed here.</small>
          </div>
          <div class="output-result" id="outputResult" hidden>
            <img id="restoredImage" alt="Image restored">
            <span class="result-badge">Restored</span>
          </div>
        </div>

        <section class="description-card" aria-label="Description of the result">
          <div class="description-head">
            <h3>Description</h3>
            <button class="icon-button small" id="descriptionReload" type="button" aria-label="Reload description">
              <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                <path d="M21 12a9 9 0 1 1-2.64-6.36" />
                <path d="M21 3v6h-6" />
              </svg>
            </button>
          </div>
          <textarea id="description" readonly placeholder="Description of the result and verification notes will be displayed here."></textarea>
        </section>

        <p class="action-message" id="actionMessage" role="status" aria-live="polite"></p>
        <button class="button save-main" id="saveButton" type="button" disabled>Save Restored Image</button>
      </article>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
